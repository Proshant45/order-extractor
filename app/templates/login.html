<!doctype html><html><head><meta charset="utf-8"><title>Sign in · Order Extractor</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/static/app.css"></head><body class="login">
<form method="post" action="/login" class="card loginbox"><div class="logo"><span class="hex">⬡</span><div><b>Texora</b>360<small>ERP Solutions</small></div></div>
<h1>Sign in</h1>{% if error %}<div class="warnbox"><div class="e">{{error}}</div></div>{% endif %}
{% if not configured %}<p class="err">Login is not configured on the server (APP_USERNAME / APP_PASSWORD_HASH).</p>{% endif %}
<label>Username<input name="username" autocomplete="username" required autofocus></label>
<label>Password<input name="password" type="password" autocomplete="current-password" required></label>
<button class="btn dark" type="submit">Sign in</button></form></body></html>
